name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create.outputs.upload_url }}
    steps:
      - uses: actions/checkout@v4
      - name: create release
        id: create
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  linux:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: install.sh syntax check
        run: bash -n install.sh
      - name: verify embedded patch matches repo copy
        run: |
          awk "/<<'RAVEN_PATCH_EOF'\$/{flag=1;next} /^RAVEN_PATCH_EOF\$/{flag=0} flag" install.sh > /tmp/embedded.patch
          diff -u /tmp/embedded.patch raven-gfx9-cu-unlock.patch
      - name: upload install.sh
        uses: softprops/action-gh-release@v2
        with:
          files: install.sh
          fail_on_unmatched_files: true

  windows:
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      # build.cmd is the single source of truth for the compile line
      # (vswhere + vcvars + cl; WinMain entry, WINDOWS subsystem,
      # kernel32+shell32+user32+gdi32, no CRT, UAC manifest).
      - name: build ravencuu.exe
        shell: cmd
        run: ravenwin\ravencuu\build.cmd
      - name: report binary size
        shell: bash
        run: |
          ls -la ravenwin/ravencuu/ravencuu.exe
          wc -c < ravenwin/ravencuu/ravencuu.exe
      - name: assemble RavenCU kit
        shell: pwsh
        run: |
          $KIT = "RavenCU"
          Remove-Item -Recurse -Force $KIT -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path "$KIT\drivers" | Out-Null
          Copy-Item ravenwin\ravencuu\ravencuu.exe $KIT\
          Copy-Item ravenwin\drivers\*.sys $KIT\drivers\
          Copy-Item ravenwin\README.md "$KIT\README.txt"
          Compress-Archive -Path $KIT -DestinationPath RavenCU.zip
          Get-Item RavenCU.zip | Select-Object Name, Length
      - name: upload RavenCU.zip
        uses: softprops/action-gh-release@v2
        with:
          files: RavenCU.zip
          fail_on_unmatched_files: true
