name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create.outputs.upload_url }}
    steps:
      - uses: actions/checkout@v4
      - name: create release
        id: create
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  linux:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: install.sh syntax check
        run: bash -n install.sh
      - name: verify embedded patch matches repo copy
        run: |
          awk "/<<'RAVEN_PATCH_EOF'\$/{flag=1;next} /^RAVEN_PATCH_EOF\$/{flag=0} flag" install.sh > /tmp/embedded.patch
          diff -u /tmp/embedded.patch raven-gfx9-cu-unlock.patch
      - name: upload install.sh
        uses: softprops/action-gh-release@v2
        with:
          files: install.sh
          fail_on_unmatched_files: true

  windows:
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: add MSVC to PATH
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: build ravencuu.exe
        shell: cmd
        run: |
          cd ravenwin\ravencuu
          cl /nologo /O1 /Os /GS- /Zl /utf-8 /W3 ravencuu.c /Fe:ravencuu.exe /link /NODEFAULTLIB kernel32.lib shell32.lib /ENTRY:main /OPT:REF /OPT:ICF /MERGE:.rdata=.text /FILEALIGN:512 /MANIFEST:EMBED "/MANIFESTUAC:"level='requireAdministrator'""
      - name: report binary size
        shell: bash
        run: |
          ls -la ravenwin/ravencuu/ravencuu.exe
          wc -c < ravenwin/ravencuu/ravencuu.exe
      - name: assemble RavenCU kit
        shell: bash
        run: |
          set -e
          KIT="$(pwd)/RavenCU"
          rm -rf "$KIT"; mkdir -p "$KIT/drivers"
          cp ravenwin/ravencuu/ravencuu.exe "$KIT/"
          cp ravenwin/kit/*.cmd          "$KIT/"
          cp ravenwin/drivers/*.sys      "$KIT/drivers/"
          cp ravenwin/README.md          "$KIT/README.txt"
          # Linux users get the one-liner; bundle it too, prefixed by README.
          {
            echo "ravencuu Windows kit ${{ github.ref_name }}"
            echo
            cat install.sh | sed 's/^/# /'
            echo
            echo "# (use the top-level one-liner, not the comments above)"
          } > "$KIT/install-linux.sh.readme"
          ( cd "$KIT/.." && zip -qr RavenCU.zip RavenCU )
          ls -la "$(pwd)/RavenCU.zip"
      - name: upload RavenCU.zip
        uses: softprops/action-gh-release@v2
        with:
          files: RavenCU.zip
          fail_on_unmatched_files: true
